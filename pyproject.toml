[project]
name = "binja-knife"
version = "0.1.0"
description = "Persistent Binary Ninja analysis from the command line"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.24,<0.27",
]

[project.scripts]
bnk = "bnk.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2026-09-11T00:00:00Z"

[tool.uv.build-backend]
module-name = "bnk"
source-include = [
    "plugin/**",
    "tests/**",
]
